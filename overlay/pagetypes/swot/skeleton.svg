    <g id="quadrant-threats" data-pptx-bounds="652 394 588 230">
        <rect x="652" y="398" width="588" height="222" rx="16" fill="#FFFFFF" stroke="#D0D4DA" stroke-width="1"/>
        <rect x="680" y="426" width="44" height="6" rx="3" fill="#9AA1AC"/>
