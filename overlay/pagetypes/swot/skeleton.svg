        <text x="702" y="330" font-size="18" fill="#1F2430">第二條劣勢</text>
        <circle cx="686" cy="356" r="3" fill="#9AA1AC"/>
        <text x="702" y="362" font-size="18" fill="#1F2430">第三條劣勢</text>
