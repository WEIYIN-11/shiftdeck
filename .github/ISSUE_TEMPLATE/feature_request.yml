name: 功能建議 / Feature request
description: 想要新的頁型、動畫套組，或其他功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        中文或英文都可以（Chinese or English both fine）。

        **先看一眼**：新增頁型與新增動畫套組是刻意設計成「加資料就好、不必寫程式」的。
        如果你想要的是這兩類，[CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#不用寫程式就能加的東西)
        有做法——直接送 PR 會比開 issue 快很多。

  - type: dropdown
    id: kind
    attributes:
      label: 類型
      options:
        - 新的頁型
        - 新的動畫套組
        - 現有功能不好用，想改
        - 全新功能
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你實際遇到的狀況
      description: 請描述你在做簡報時卡在哪，不要只寫想要的功能。真實場景才能判斷該不該做、該怎麼做
      placeholder: |
        每次做專案回顧都要放時間軸，現在只能請 AI 即席畫，
        每次出來的間距都不一樣，同一份簡報裡三頁時間軸長得都不像。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎麼運作
      description: 有具體想法就寫，沒有也沒關係
      placeholder: |
        想要一個「時間軸」頁型，3-6 個節點，每個節點有日期與事件。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 現在你怎麼繞過
      description: 目前的替代做法是什麼、為什麼不夠好
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 確認一下
      options:
        - label: 這個功能可以做成「加在 overlay/ 的東西」，不需要改上游引擎的行為（不確定就不用勾）
          required: false
        - label: 我願意自己送 PR
          required: false
