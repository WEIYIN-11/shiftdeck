    "patches": {
      "01-zh-tw-locale.patch": "階段 1＋E6：新增 zh-TW 語言（純加法，未動 en/ja/zh）。兩個 index.html 各只加一行語言選單項目——語言切換器是硬編碼 <li>，不改 HTML 就選不到繁體中文。E6 另加 confirm_ui/server.py 一行：_localized_text_present() 的 suffix tuple 補 _zh_tw，否則 stage2 推薦檔只寫繁中會被 /api/recommendations 回 409（已用真實 HTTP 重現：v4.5.0 回 409 custom_candidates.mode requires non-empty localized name，補完回 200）。E6 刻意併進 01 而不另開 05，因為它是同一個 PR 的伺服器端另一半——上游合併後整個 patch 一次刪掉即可；若獨立成 05，其基準會是 01→03→04 之後的樹，抽不出乾淨的上游 diff。",
      "03-animation-selector.patch": "階段 3：動畫選擇器（純加法）。兩個 server.py 各加一段 overlay bootstrap 與新 API（confirm_ui: /api/animation-presets ＋ 確認後寫 animations.json；svg_editor: /api/animations GET/POST 與 /api/animations/preset）；兩個 app.js 加四語字串與 UI；svg_editor/index.html 加一個空容器 div。所有邏輯與資料都在 overlay/animations/，vendor 端只是接線——overlay 不存在時兩個伺服器自動退回上游行為（API 回 available:false／空清單）。基準為 01 patch 套用後的樹，兩者需依序套用。",
      "04-single-page-regen.patch": "階段 4：單頁重生成＋換頁型＋套組自動套用（純加法）。基準為 01→03 依序套用後的樹，三者需依序套用。動了 5 個檔案，其中 2 個是本階段新增的 patched file：(1) finalize_svg.py 加 --pages：覆蓋層做不到——finalize 的步驟順序與未來新增的步驟都住在引擎裡，overlay 若自己重排一次 svg_finalize.* 的呼叫順序，下次升級引擎就會靜默走樣；引擎自己的檔頭也明講這條管線與 svg_to_pptx 共用、刪步驟會連帶壞掉。實測：含圖 20 頁全量 3.007s、只跑 1 頁 0.768s，且兩者產出的 svg_final 逐 byte 相同。(2) svg_to_pptx.py（23 行的薄 wrapper）加匯出前自動展開動畫套組：覆蓋層做不到——匯出是使用者與工作流直接呼叫的入口，要讓「確認頁選了套組」在標準 Step 7 指令下自動生效，只能掛在這個入口；改成叫 overlay 的另一支腳本等於改掉既有流程。條件極窄（result.json 有 preset、animations.json 沒有 slides、未帶 --no-animations/--animation-config），任一不成立就完全不動作。另外 3 個檔案沿用階段 3 已有的 patched file：svg_editor/server.py 加選取狀態通道與重生成請求 API（/api/selection、/api/pagetypes、/api/regen、/api/regen/cancel、/api/animations/save-preset）；svg_editor/static/app.js 加四語字串、頁型挑選面板、套組另存 UI；svg_editor/static/index.html 加一個空容器 div。overlay/regen 或 overlay/animations 不存在時所有新 API 回 available:false／404，伺服器與匯出照常運作（已實測）。",
      "05-preview-eager-load.patch": "E7：風格預覽縮圖改為即時載入（兩處小改動）。上游 appendVisualStyleImage() 對 18 張 style_previews/*.svg 寫死 loading=\"lazy\"，使用者每次切到視覺方向區塊或改選項，圖才開始下載與解碼，體感是預覽慢半拍（使用者實際回報：「選項點選的預覽好不及時」）。覆蓋層做不到——那幾行 img 屬性在上游函式內部，overlay 沒有介入點去改一個既有 DOM 節點的 loading/decoding。改動：loading 改 eager 並加 decoding=sync；新增 prefetchVisualStylePreviews() 在 renderVisualDirection() 開頭把整份目錄預抓進瀏覽器快取。實測（Playwright，完全未捲動）：頁面載入後即請求 18 張縮圖，DOM 內 21 個 img 全部 loading=eager 且 complete。基準為 01→03→04 套用後的樹，需依序套用。",
      "06-paragraph-latin-headroom.patch": "E8：多段落文字框補中西混排的寬度落差（第 10 個 patched file）。上游對單行框加 6% headroom、對多段落框刻意不加（elements.py 的 _estimate_text_runs_width 說明：多段落框把這個值當換行約束，加了會把合併後的框撐得比作者的原始行寬大）。這個取捨本身正確，但留下一個缺口：多段落框的寬度取自區塊內最寬的那一行，而實測（微軟正黑體 + LibreOffice）CJK 估算精準、含數字或拉丁的行低估約 3%——只要最寬那行剛好中西混排，就是 0% 餘裕碰上 3% 低估，必定被折行，且 svg_quality_checker 完全不會報（實測 0 errors、quality_gate=passed，PNG 裡字掉出卡片）。覆蓋層做不到——這是引擎內部的文字寬度估算函式，overlay 沒有任何介入點；而且它不是新功能，是把上游既有的補償邏輯補到它漏掉的那條路徑上。改動只有一個常數與一個小函式：含非 CJK 字元的行整行 ×1.04，純中文行一個 px 都不動（落差來自 LibreOffice 在中西交界插入的間距，不是拉丁字元本身，所以按整行算而非按字元算）。回歸實測：KPI 的跑版案例修復（『會員組負／責』併回單行）；流程圖 3 頁 pixel-identical；12 頁 deck 有 3 頁變化且全部是原本斷行處被修好，無一頁變壞。基準為 01→03→04→05 套用後的樹，需依序套用。"
